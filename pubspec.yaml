name: jira_watcher
description: "A Jira client, built to easily overview recent updates, and keep tabs on your work items."
publish_to: "none"
version: 1.8.2

environment:
  sdk: ^3.11.0-93.1.beta

dependencies:
  window_manager: ^0.5.1
  calendar_date_picker2: ^3.0.0
  charset: ^2.0.1
  chewie: ^1.13.0
  cryptography: ^2.7.0
  csv: ^8.0.0
  diff_match_patch: ^0.4.1
  fading_edge_scrollview: ^4.1.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.0.9
  flutter_web_auth_2: ^5.0.3
  html: ^0.15.6
  http: ^1.4.0
  intl: ^0.20.2
  local_auth: ^3.0.0
  loggy: ^2.0.3
  material_symbols_icons: ^4.2815.1
  media_kit: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  mime: ^2.0.0
  observable_datasets: ^1.0.2
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  super_clipboard: ^0.9.1
  url_launcher: ^6.3.1
  video_player: ^2.10.0
  xml: ^7.0.1
  flutter_context_menu: ^0.4.2
  flutter_markdown: ^0.7.7+1
  file_selector: ^1.1.0
  archive: ^4.0.9
  crypto: ^3.0.7

  # Generated from Atlassian's OpenAPI specs; see packages/*/README.md and
  # tool/generate_jira_api.ps1. Path dependencies rather than a separate
  # repository so a change to a client and its caller stays one commit.
  jira_platform_api:
    path: packages/jira_platform_api
  jira_software_api:
    path: packages/jira_software_api
  confluence_api:
    path: packages/confluence_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.12

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Regular.ttf
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Italic.ttf
          style: italic

