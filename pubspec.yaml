name: jira_watcher
description: "A Jira client, built to easily overview recent updates."
publish_to: "none"
version: 1.1.2

environment:
  sdk: ^3.9.0-100.2.beta

dependencies:
  charset: ^2.0.1
  chewie: ^1.13.0
  cryptography: ^2.7.0
  csv: ^6.0.0
  diff_match_patch: ^0.4.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_json: ^0.0.4
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.9
  flutter_web_auth_2: ^4.1.0
  html: ^0.15.6
  http: ^1.4.0
  material_symbols_icons: ^4.2815.1
  media_kit: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^1.3.1
  mime: ^2.0.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  super_clipboard: ^0.9.1
  url_launcher: ^6.3.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.12

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Regular.ttf
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto_Mono/static/RobotoMono-Italic.ttf
          style: italic
